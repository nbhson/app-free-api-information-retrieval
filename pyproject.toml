[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-llm-provider-discovery"
version = "1.7.0"
description = "CLI tool để khám phá và thu thập danh sách các LLM API provider miễn phí"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Free LLM Discovery Team"}
]
keywords = ["llm", "api", "free", "openai-compatible", "provider-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/nguyenson/app-free-api-information-retrieval"
Repository = "https://github.com/nguyenson/app-free-api-information-retrieval"
Issues = "https://github.com/nguyenson/app-free-api-information-retrieval/issues"
Changelog = "https://github.com/nguyenson/app-free-api-information-retrieval/blob/main/CHANGELOG.md"
dependencies = [
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
    "click>=8.2.0",
    "rich>=13.9.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
free-llm-providers = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T20", "ISC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["**/__pycache__/**", "**/venv/**"]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 90

[tool.mypy]
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true
