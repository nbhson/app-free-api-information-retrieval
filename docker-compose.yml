services:
  app:
    build: .
    image: free-llm-provider-discovery:latest
    # Chạy lệnh mặc định; override bằng: docker compose run app list --verify
    command: ["list"]
    volumes:
      # Lưu output data ra host
      - ./data:/app/data
    env_file:
      - .env

  # REST API server — query provider từ app khác
  # Chạy: docker compose up api
  api:
    build: .
    image: free-llm-provider-discovery:latest
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
