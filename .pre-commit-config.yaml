# Pre-commit hooks — chạy tự động trước mỗi commit
# Cài đặt: pip install pre-commit && pre-commit install
# Chạy thủ công trên toàn bộ repo: pre-commit run --all-files
repos:
  # ─── Ruff: lint + format (thay black, isort, flake8) ───
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ─── Standard file hygiene ───
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ─── mypy: type checking ───
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.0.0
          - pydantic-settings>=2.0.0
          - types-PyYAML
          - click>=8.0.0
        args: [--ignore-missing-imports]
